<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="shot-page">
  <div class="shot shot-3">
    <div class="glow"></div>
    <div class="copy">
      <div class="eyebrow">Now Playing</div>
      <h1 class="headline">Immersive<br/>playback</h1>
      <p class="subhead">Queue, sleep timer, shuffle &amp; resume where you left off</p>
    </div>
    <div class="device-wrap">
      <div class="device">
        <div class="device-notch"></div>
        <div class="device-screen">
          <div class="np">
            <div class="status-bar" style="width:100%"><span>9:41</span><span>●●● 5G</span></div>
            <div style="align-self:flex-start;font-size:32px;opacity:0.8">∨</div>
            <div class="np-art"></div>
            <div class="np-title">Midnight Drive</div>
            <div class="np-artist">Nova Lane · Night Roads</div>
            <div class="np-slider"></div>
            <div class="np-times"><span>1:24</span><span>3:42</span></div>
            <div class="np-controls">
              <span style="color:#00E5C0">⇆</span>
              <span style="font-size:40px;color:#fff">⏮</span>
              <div class="np-play">▶</div>
              <span style="font-size:40px;color:#fff">⏭</span>
              <span>↻</span>
            </div>
            <div style="margin-top:28px;color:#00E5C0;font-size:15px;font-weight:600">Sleep in 14:32</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
